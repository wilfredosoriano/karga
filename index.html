<style>
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--bg:#fff;--card:#f4f4f3;--card2:#fff;--ink:#000;--muted:#6b6b6b;--faint:#8f8f8f;--line:#e4e4e2;--fill:#000;--on:#fff;--track:#e0e0de;--blue-bg:#e4eefc;--blue:#2259b8;--green-bg:#e3f4e7;--green:#1b6e36;--amber-bg:#fcefd9;--amber:#7f4b00;--red-bg:#fce8e6;--red:#b42318;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--card:#1c1c1c;--card2:#262626;--ink:#fff;--muted:#a8a8a8;--faint:#8a8a8a;--line:#2e2e2e;--fill:#fff;--on:#000;--track:#363636;--blue-bg:#17294a;--blue:#8db6f5;--green-bg:#133420;--green:#7fd49a;--amber-bg:#3a2a0c;--amber:#f2c46d;--red-bg:#3e1714;--red:#f4a39a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f0f;--card:#1c1c1c;--card2:#262626;--ink:#fff;--muted:#a8a8a8;--faint:#8a8a8a;--line:#2e2e2e;--fill:#fff;--on:#000;--track:#363636;--blue-bg:#17294a;--blue:#8db6f5;--green-bg:#133420;--green:#7fd49a;--amber-bg:#3a2a0c;--amber:#f2c46d;--red-bg:#3e1714;--red:#f4a39a;color-scheme:dark}
html,body{background:var(--bg)}
/* No double-tap-to-zoom on the app's pages and buttons (the map keeps its own zoom gestures) */
html,body,button,input,label,a,.sheet,.nav{touch-action:manipulation}
body{margin:0;color:var(--ink);font-family:'Onest',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:12px 16px 128px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0}
.h2{font-size:17px;font-weight:600;margin:0}
.t15{font-size:15px;font-weight:600}
.sub{font-size:12.5px;color:var(--muted)}
.tiny{font-size:11.5px;color:var(--faint)}
.av{width:44px;height:44px;border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.rb{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rb.ghost{border:none;background:none}
.blk{background:var(--fill);color:var(--on);border-radius:24px;padding:18px}
.cap{font-size:12.5px;opacity:.8}
.amt{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pill{background:var(--bg);color:var(--ink);border-radius:26px;height:48px;padding:0 16px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.pill.sm{height:38px;font-size:13px}
.card{background:var(--card);border-radius:20px;padding:16px;display:block;width:100%;text-align:left}
.card.row{display:flex}
.inner{background:var(--card2);border-radius:14px;padding:2px 14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:none}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:6px;border-radius:3px;background:var(--ink)}
.chip{font-size:12px;font-weight:500;padding:5px 11px;border-radius:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.c-blue{background:var(--blue-bg);color:var(--blue)}.c-green{background:var(--green-bg);color:var(--green)}.c-amber{background:var(--amber-bg);color:var(--amber)}.c-red{background:var(--red-bg);color:var(--red)}
.cta{background:var(--fill);color:var(--on);border-radius:16px;height:54px;width:100%;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.sec{border:1px solid var(--line);border-radius:16px;height:48px;width:100%;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card2)}
.danger{color:var(--red)}
.sel{border:1px solid var(--line);border-radius:18px;height:38px;padding:0 14px;font-size:13px;font-weight:500;background:var(--card2);display:inline-flex;align-items:center;gap:6px}
.sel.on{background:var(--fill);color:var(--on);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.ico{width:42px;height:42px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lbl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.err{font-size:13px;color:var(--red)}.err:empty{display:none}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:28px;padding:4px 4px 4px 14px;color:var(--faint)}
.search input{flex:1;border:none;background:none;height:40px;font-size:16px;color:var(--ink);outline:none;min-width:0}
.dot{width:22px;height:22px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.dot.on{background:var(--fill);color:var(--on)}.dot.off{background:var(--track)}
.seg{flex:1;height:4px;background:var(--track);position:relative}
.seg>i{position:absolute;left:0;top:0;height:4px;background:var(--ink)}
.navwrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5}
.nav{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:34px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.nav button{height:50px;min-width:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);padding:0 13px;font-size:13px;font-weight:600}
.nav button.on{background:var(--fill);color:var(--on)}
.nav button .t{display:none}.nav button.on .t{display:inline}
.nav .div{width:1px;height:28px;background:var(--line);margin:0 4px;flex-shrink:0}
.nav .act{width:50px;height:50px;min-width:50px;border-radius:25px;padding:0;background:var(--track);color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:16px}
.grab{width:44px;height:4px;border-radius:2px;background:var(--track);margin:0 auto}
.scrim.center{align-items:center;padding:16px}
/* Pop-up: same black card as .blk (inverts in dark mode), with the white pill button used there */
.modal{background:var(--fill);color:var(--on);width:100%;max-width:360px;border-radius:24px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal .x{position:absolute;top:10px;right:10px;color:inherit}
.modal .sub{color:inherit;opacity:.8}
.modal .ico{background:rgba(127,127,127,.28);color:inherit}
.modal .pill{width:100%}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:16px;padding:4px}
.tabs button{height:42px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--fill);color:var(--on);padding:12px 18px;border-radius:24px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sw{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:15px;background:var(--track);position:relative;flex-shrink:0;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw:checked{background:var(--fill)}.sw:checked::after{left:23px;background:var(--on)}
.welcome{max-width:480px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:28px 20px 32px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.logo{width:72px;height:72px;border-radius:20px;background:var(--fill);color:var(--on);display:flex;align-items:center;justify-content:center}
.or{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--faint)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.seg3 button{height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg3 button.on{background:var(--card2);color:var(--ink)}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}
/* Karga additions, built from existing tokens */
#mapPage{position:fixed;inset:0;display:none}
body.on-map #mapPage{display:block}
body.on-map #page{display:none}
#map{position:absolute;inset:0;background:var(--card)}
.mtop{position:absolute;left:0;right:0;top:0;max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:2}
.mtop>*{pointer-events:auto}
.mtop .row{align-items:center}
.mchips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:3px 0}
.mchips::-webkit-scrollbar{display:none}
.mtop .chip{align-self:flex-start;font-size:13px}
.mapmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.mapmsg .card{max-width:400px}
.mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-bottom-right{bottom:calc(80px + env(safe-area-inset-bottom,0px))!important}
.aim{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);color:var(--ink);pointer-events:none;z-index:2;display:none;line-height:0}
body.placing .aim{display:block}
body.placing .mtop,body.placing .navwrap{display:none}
.placebar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:6}
.trunc{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bico{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.bico .star{position:absolute;right:-3px;top:-3px;width:18px;height:18px;border-radius:9px;background:#f5b301;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--card2)}
.mbtns{display:flex;gap:8px}
.mtypes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mtype{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-align:left}
.mtype.on{border-color:var(--fill)}
.mtype .sw{display:block;width:100%;height:64px;border-radius:10px;margin-bottom:4px}
.li3d{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);width:100%}
.tg{width:46px;height:28px;border-radius:14px;background:var(--track);position:relative;flex-shrink:0;transition:background .2s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg.on{background:var(--fill)}.tg.on::after{transform:translateX(18px)}
.sel{white-space:nowrap;flex-shrink:0}
.sbar{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.mtop .mchips{flex:none}
.rb.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="mapPage">
  <div id="map"></div>
  <div class="mtop" id="mtop"></div>
  <div class="aim" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 1.5c-4.3 0-7.8 3.4-7.8 7.7 0 4.9 5.6 10.1 7 11.3.5.4 1.1.4 1.6 0 1.4-1.2 7-6.4 7-11.3 0-4.3-3.5-7.7-7.8-7.7zm0 3.6s-3.4 3.9-3.4 6.2a3.4 3.4 0 0 0 6.8 0c0-2.3-3.4-6.2-3.4-6.2z"/></svg></div>

<script>
/* ===== Setup: the build (scripts/build.mjs) fills this in from MAPBOX_TOKEN in .env or Vercel ===== */
const MAPBOX_TOKEN = 'pk.REPLACE_WITH_YOUR_MAPBOX_PUBLIC_TOKEN';
const HAS_TOKEN = /^pk\./.test(MAPBOX_TOKEN) && !MAPBOX_TOKEN.includes('REPLACE');
// Firebase web config (public by design; access is controlled by firestore.rules). Filled in by the build
// from FIREBASE_* variables. When it's null, sign-in and shared prices are hidden and the app works offline-style.
const FIREBASE_CONFIG = /*FIREBASE_CONFIG*/null;

const KEY = 'karga-v1', OSM_KEY = 'karga-osm';
const DEF = () => ({name:'', theme:'auto', dir:'google', f:[], open:false, fuel:'unleaded', sort:'near', mine:[], fav:[], tips:{}, last:null, mapType:'simple', map3d:false});
// Keys match api/_norm.js. c = pin color, g = glyph color on top of it. Ordered by how common they are.
const BRANDS = [
  {k:'petron', n:'Petron', c:'#1f4fa8', g:'#fff'}, {k:'shell', n:'Shell', c:'#f6c000', g:'#c4161c'},
  {k:'caltex', n:'Caltex', c:'#d52b1e', g:'#fff'}, {k:'seaoil', n:'Seaoil', c:'#00897b', g:'#fff'},
  {k:'phoenix', n:'Phoenix', c:'#f26522', g:'#fff'}, {k:'flyingv', n:'Flying V', c:'#c2185b', g:'#fff'},
  {k:'total', n:'TotalEnergies', c:'#3949ab', g:'#fff'}, {k:'jetti', n:'Jetti', c:'#0288d1', g:'#fff'},
  {k:'ptt', n:'PTT', c:'#6d4c41', g:'#fff'}, {k:'unioil', n:'Unioil', c:'#8e24aa', g:'#fff'},
  {k:'centrum', n:'Centrum', c:'#827717', g:'#fff'}, {k:'cleanfuel', n:'Cleanfuel', c:'#2b8a3e', g:'#fff'},
  {k:'other', n:'Others', c:'#5f6368', g:'#fff'}
];
const brandOf = k => BRANDS.find(b => b.k === k) || BRANDS[BRANDS.length - 1];
const FUELS = [{k:'unleaded', n:'Unleaded'}, {k:'premium', n:'Premium'}, {k:'diesel', n:'Diesel'}];
const fuelName = k => (FUELS.find(f => f.k === k) || {n:''}).n;
const LOGO = '<path fill-rule="evenodd" d="M12 1.5c-4.3 0-7.8 3.4-7.8 7.7 0 4.9 5.6 10.1 7 11.3.5.4 1.1.4 1.6 0 1.4-1.2 7-6.4 7-11.3 0-4.3-3.5-7.7-7.8-7.7zm0 3.6s-3.4 3.9-3.4 6.2a3.4 3.4 0 0 0 6.8 0c0-2.3-3.4-6.2-3.4-6.2z"/><rect x="7.5" y="21.3" width="9" height="2" rx="1"/>';
const logo = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${LOGO}</svg>`;
const P = {
  x:'<path d="M18 6 6 18M6 6l12 12"/>',

/* ===== Distance ===== */
function km(a, b){
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*rad) * Math.cos(b.lat*rad) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtKm = d => d < 1 ? `${Math.max(10, Math.round(d*100)*10)} m` : d < 10 ? `${d.toFixed(1)} km` : `${Math.round(d)} km`;
const fmtMin = s => { const m = Math.max(1, Math.round(s/60)); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`; };

/* ===== Location ===== */
let pos = null, geo = 'idle', watchId = null, userMoved = false;
function startLocate(){
  if(!('geolocation' in navigator)){ geo = 'error'; return; }
  if(watchId !== null) return;
  geo = 'asking';
  watchId = navigator.geolocation.watchPosition(p => {
    const first = !pos;
    pos = {lat:p.coords.latitude, lon:p.coords.longitude};
    geo = 'ok';
    updateMe();
    if(first){
      // Your first location always gets its stations, even if a fallback load around the map
      // center already happened (slow GPS). Areas already loaded nearby aren't fetched again.
      autoDone = false; loadArea();
      S.last = [+pos.lat.toFixed(3), +pos.lon.toFixed(3)]; persist();
      if(map && !userMoved && !placing) map.flyTo({center:[pos.lon, pos.lat], zoom:14});
      if(placing && map && !placing.editId) map.easeTo({center:[pos.lon, pos.lat], zoom:17});
      renderTop();
      if(page !== 'map') render();
    }
  }, err => {
    if(err.code === 1){ // permission denied: stop asking
      geo = 'denied';
      navigator.geolocation.clearWatch(watchId); watchId = null;
    } else if(!pos) geo = 'error'; // timeout or no signal yet: keep the watch running, it may still find you
    loadArea(); // meanwhile, load once around the map center
    renderTop();
    if(page !== 'map') render();
  }, {enableHighAccuracy:true, maximumAge:15000, timeout:30000});
}
function locateMe(){
  if(pos){ go('map'); if(map) map.flyTo({center:[pos.lon, pos.lat], zoom:Math.max(map.getZoom(), 14)}); return; }
  if(geo === 'denied'){ toast('Location is blocked. Allow location for this site in your browser or phone settings, then try again.'); return; }
  startLocate(); toast('Finding your location');
}

/* ===== Station data (OpenStreetMap) ===== */
const OSM = new Map();
// Stations arrive already shaped by api/_norm.js: {id, lat, lon, b, bn, name, addr, h?}.
let cells = {}, loading = false;
// v4 = stations that know their town (t); older saved copies are dropped and reloaded once.
const OSM_V = 4;
function initData(){
  try{
    const c = JSON.parse(localStorage.getItem(OSM_KEY) || 'null');
    if(c && c.v === OSM_V){
      Object.assign(cells, c.cells);
      c.st.forEach(s => OSM.set(s.id, s));
    }
  }catch(e){}
  refreshMap(); loadArea();
  if(page === 'list') render();
}
function saveOsm(){ try{ localStorage.setItem(OSM_KEY, JSON.stringify({v:OSM_V, cells, st:[...OSM.values()]})); }catch(e){} }
// Only stations near you: /api/stations returns everything within 5 km of a point.
// Stations are kept on the phone, and each loaded point is kept in `cells` with when it loaded.
// Loading happens once per app open (around you, or the map center if location is off)
// and otherwise only when you tap the refresh button. Moving the map never loads.
// A point loaded more than STALE_DAYS ago loads again, and each load replaces the stations
// within 5 km of it, so stations removed from the server's list also leave the phone.
const RELOAD_KM = 2, AREA_KM = 5, STALE_DAYS = 7;
const fresh = t => Date.now() - t < STALE_DAYS * 864e5;
// Puts `list` on the phone, dropping the stations `inArea` covers that the server no longer has.
// Returns how many stations are new.
function replaceStations(list, inArea){
  const keep = new Set(list.map(s => s.id));
  for(const s of OSM.values()) if(!keep.has(s.id) && inArea(s)) OSM.delete(s.id);
  let added = 0;
  list.forEach(s => { if(!OSM.has(s.id)) added++; OSM.set(s.id, s); });
  return added;
}
let areaTimer, autoDone = false;
// `at` loads around a chosen point instead (a place picked in search).
function loadArea(force, at){
  if(!force && autoDone) return;
  clearTimeout(areaTimer);
  areaTimer = setTimeout(async () => {
    let c = at || pos;
    if(!c){
      if(!force && (geo === 'asking' || geo === 'idle')) return; // wait for the first location fix
      if(!map) return;
      const m = map.getCenter(); c = {lat:m.lat, lon:m.lng};
    }
    if(!force) autoDone = true;
    if(!force && Object.entries(cells).some(([k, t]) => { const [lat, lon] = k.split(':').map(Number); return fresh(t) && km({lat, lon}, c) < RELOAD_KM; })){ setStatus(''); return; }
    if(loading) return;
    const lat = c.lat.toFixed(2), lon = c.lon.toFixed(2);
    loading = true; setStatus('loading'); renderTop();
    try{
      // The free servers fail now and then, so try once more before showing an error.
      let r = await fetch(`/api/stations?lat=${lat}&lon=${lon}`).catch(() => null);
      if(!r || !r.ok){ await new Promise(ok => setTimeout(ok, 2000)); r = await fetch(`/api/stations?lat=${lat}&lon=${lon}`); }
      if(!r.ok) throw new Error(r.status);
      const j = await r.json(), here = {lat:+lat, lon:+lon};
      // Just inside 5 km, so rounding never drops a station the server counted as in range.
      const n = replaceStations(j.stations || [], s => km(here, s) < AREA_KM - 0.05);
      for(const k in cells) if(!fresh(cells[k])) delete cells[k];
      cells[lat+':'+lon] = Date.now();
      saveOsm(); setStatus(''); refreshMap();
      const where = at ? 'here' : 'near you';
      if(force) toast(n > 0 ? `Found ${n} more station${n === 1 ? '' : 's'} ${where}` : `Stations ${where} are up to date`);
      if(page === 'list') render();
    }catch(err){ setStatus('error'); }
    finally{ loading = false; renderTop(); }
  }, force ? 0 : 500);
}
function refreshHere(){
  if(!pos && geo !== 'denied') startLocate();
  if(pos && map) map.flyTo({center:[pos.lon, pos.lat], zoom:Math.max(map.getZoom(), 14)});
  loadArea(true);
}

const brandName = k => (BRANDS.find(b => b.k === k) || {n:'Other'}).n;
const mineToSt = m => ({id:m.id, lat:m.lat, lon:m.lon, b:m.brand, bn:m.brand === 'other' ? 'Other brand' : brandName(m.brand), name:m.name || (m.brand === 'other' ? 'Gas station' : brandName(m.brand)), addr:'', note:m.note, mine:true});
// Pinned stations keep a copy of their details, so they still show if OpenStreetMap drops them.
const isFav = id => S.fav.some(f => f.id === id);

// remembers the old name in `was`. Used wherever stations are listed or looked up.
const ov = s => {

  if(!d || !d.name) return s;

/* ===== Opening hours ===== */
// Reads the common OpenStreetMap opening_hours forms: "24/7", "Mo-Sa 06:00-22:00; Su 07:00-20:00",
// "06:00-22:00", "Mo-Fr 06:00-12:00,13:00-21:00", "Su off". Anything else (holidays, months, sunrise…)
// is shown as written and treated as unknown. Later rules override earlier ones for their days, as in OSM.
const DAYS = ['mo', 'tu', 'we', 'th', 'fr', 'sa', 'su'];
const hoursCache = new Map();
function parseHours(h){
  if(!h) return null;
  if(/^\s*24\/7\s*$/.test(h)) return {always:true};
  const week = Array.from({length:7}, () => null);
  for(const rule of h.split(';').map(r => r.trim()).filter(Boolean)){
    if(/^(PH|SH)\b/i.test(rule)) continue; // public/school holiday rules: ignored
    const m = rule.match(/^(?:([A-Za-z]{2}(?:\s*[-,]\s*[A-Za-z]{2})*)\s+)?(off|closed|[\d:,\-+\s]+)$/i);
    if(!m) return null;
    let days = [0, 1, 2, 3, 4, 5, 6];
    if(m[1]){
      days = [];
      for(const part of m[1].toLowerCase().split(',').map(x => x.trim())){
        const [a, b] = part.split('-').map(x => DAYS.indexOf(x.trim()));
        if(a < 0 || (b !== undefined && b < 0)) return null;
        if(b === undefined) days.push(a); else for(let d = a; ; d = (d + 1) % 7){ days.push(d); if(d === b) break; }
      }
    }
    let spans = [];
    if(!/^(off|closed)$/i.test(m[2])){
      for(const t of m[2].split(',').map(x => x.trim()).filter(Boolean)){
        const tm = t.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/) || t.match(/^(\d{1,2}):(\d{2})\+$/);
        if(!tm) return null;
        const start = +tm[1]*60 + +tm[2];
        let end = tm[3] != null ? +tm[3]*60 + +tm[4] : 1440;
        if(end <= start) end += 1440; // runs past midnight
        spans.push([start, end]);
      }
    }
    days.forEach(d => week[d] = spans);
  }
  if(week.every(s => s && s.some(([a, b]) => a === 0 && b >= 1440))) return {always:true};
  return {week};
}
const fmtTime = mins => { const m = ((mins % 1440) + 1440) % 1440, h = Math.floor(m/60), mm = m % 60; return `${h % 12 || 12}${mm ? ':' + String(mm).padStart(2, '0') : ''} ${h < 12 ? 'AM' : 'PM'}`; };
// → {open: true/false/null (unknown), text, always}
function hoursOf(s, now = new Date()){
  if(!s.h) return {open:null, text:''};
  let p = hoursCache.get(s.h);
  if(p === undefined){ p = parseHours(s.h); hoursCache.set(s.h, p); }
  if(!p) return {open:null, text:s.h};
  if(p.always) return {open:true, always:true, text:'Open 24 hours'};
  const d = (now.getDay() + 6) % 7, t = now.getHours()*60 + now.getMinutes();
  const today = p.week[d] || [], yest = p.week[(d + 6) % 7] || [];
  const cur = today.find(([a, b]) => a <= t && t < b) || yest.filter(([, b]) => b > 1440).map(([a, b]) => [a - 1440, b - 1440]).find(([, b]) => t < b);
  if(cur) return {open:true, text:`Open · closes ${fmtTime(cur[1])}`};
  const later = today.filter(([a]) => a > t).sort((x, y) => x[0] - y[0])[0];
  if(later) return {open:false, text:`Closed · opens ${fmtTime(later[0])}`};
  for(let i = 1; i <= 7; i++){
    const n = (p.week[(d + i) % 7] || []).slice().sort((x, y) => x[0] - y[0])[0];
    if(n) return {open:false, text:`Closed · opens ${i === 1 ? 'tomorrow' : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][(d + i) % 7]} ${fmtTime(n[0])}`};
  }
  return {open:false, text:'Closed'};
}
const find = id => { const m = S.mine.find(x => x.id === id); return m ? mineToSt(m) : ov(OSM.get(id) || S.fav.find(f => f.id === id)); };
function toggleFav(id){

  if(isFav(id)){ S.fav = S.fav.filter(f => f.id !== id); toast('Removed from pinned'); }
  else { const {id:i, lat, lon, b, bn, name, addr, h, mine} = s; S.fav.push({id:i, lat, lon, b, bn, name, addr, h, mine:!!mine}); toast('Pinned'); }

// Teardrop pin in the brand color with a fuel pump (or the Karga drop for your own stations),
// and a gold star badge when pinned. Drawn at 2x; the tip of the pin sits on the station.
const PIN_W = 60, PIN_H = 68;
function pinImage(brand, mine, fav, bg){
  const b = brandOf(brand), c = document.createElement('canvas'); c.width = PIN_W; c.height = PIN_H;
  const x = c.getContext('2d'), s = 2.5;
  x.save(); x.translate(30 - 12*s, 66 - 22*s); x.scale(s, s);
  const shape = new Path2D('M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z');
  x.shadowColor = 'rgba(0,0,0,.28)'; x.shadowBlur = 4; x.shadowOffsetY = 1;
  x.fillStyle = b.c; x.fill(shape); x.shadowColor = 'transparent';
  x.lineWidth = 1.2; x.strokeStyle = bg; x.stroke(shape);

  if(mine){ x.fillStyle = b.g; x.fill(new Path2D('M12 3.5c-3.6 0-6.4 2.8-6.4 6.3 0 4 4.6 8.3 5.7 9.3.4.3.9.3 1.3 0 1.1-1 5.8-5.3 5.8-9.3 0-3.5-2.9-6.3-6.4-6.3z')); }
  else { x.strokeStyle = b.g; x.lineWidth = 2.6; x.lineCap = x.lineJoin = 'round'; x.stroke(new Path2D(P.fuel.match(/d="([^"]+)"/)[1])); }
  x.restore();

    x.beginPath(); x.arc(45, 20, 12, 0, Math.PI*2); x.fillStyle = '#f5b301'; x.fill(); x.lineWidth = 3; x.strokeStyle = bg; x.stroke();
    x.save(); x.translate(45, 20); x.scale(.65, .65); x.translate(-12, -11.5); x.fillStyle = '#fff'; x.fill(new Path2D(STAR)); x.restore();
  }

/* ===== Fuel prices (Firestore "reports", one per person per station per fuel) ===== */
// A station's price for a fuel is the middle value (median) of up to 5 recent reports from different
// people, so one wrong report can't move it much. Reports older than 30 days are ignored.
// PR.on: null = still loading, false = no Firebase, true = working.
const PR = {on:null, map:new Map(), got:new Map(), st:new Map(), dec:new Map()};
const sharedId = id => /^[nwr]\d+$/.test(id); // stations people add stay private, so they have no shared prices
const priceShown = () => PR.on !== false && S.fuel !== 'off';
const peso = p => `₱${p.toFixed(2)}`;
const MAX_AGE = 30 * 864e5;
function ago(t){
  const m = Math.round((Date.now() - t) / 60000);
  if(m < 60) return m < 2 ? 'just now' : `${m} min ago`;
  const h = Math.round(m / 60); if(h < 24) return `${h} hour${h === 1 ? '' : 's'} ago`;
  const d = Math.round(h / 24); return `${d} day${d === 1 ? '' : 's'} ago`;
}
function summarize(reports){
  const out = {};
  for(const f of FUELS){
    const rs = reports.filter(r => r.f === f.k && Date.now() - r.at < MAX_AGE).sort((a, b) => b.at - a.at).slice(0, 5);
    if(!rs.length) continue;
    const ps = rs.map(r => r.p).sort((a, b) => a - b), mid = ps.length >> 1;
    out[f.k] = {p:ps.length % 2 ? ps[mid] : (ps[mid - 1] + ps[mid]) / 2, at:rs[0].at, n:rs.length, mine:AU.user ? rs.find(r => r.uid === AU.user.uid) : null};
  }
  return out;
}
// Closed stations. People can report a station closed ("status", one per person per station); those are
// only reports for review. A station is closed only when an admin decides so ("decisions/<stationId>").
// Admins are listed by hand in Firestore (admins/<uid>) and get a review list in Settings.
const ST_AGE = 90 * 864e5;
const statusOf = s => PR.st.get(s.id) || null;              // {closed: count, mine: 'closed'|null}
const decisionOf = s => PR.dec.get(s.id) || null;           // {closed: bool, name, b, at}
const isClosed = s => decisionOf(s)?.closed === true;
// Fetches prices, closed reports and admin decisions for stations not checked in the last 5 minutes.
// Resolves true when something changed.
async function loadPrices(ids){
  if(PR.on === false || !(await fbReady)) return false;
  const now = Date.now(), need = [...new Set(ids)].filter(id => sharedId(id) && !(now - (PR.got.get(id) || 0) < 3e5)).slice(0, 60);
  if(!need.length) return false;
  need.forEach(id => PR.got.set(id, now));
  try{
    const {fs, db} = AU, byId = new Map(need.map(id => [id, []])), sts = new Map(need.map(id => [id, {closed:0, mine:null}]));
    const decs = new Map();
    for(let i = 0; i < need.length; i += 30){ // Firestore "in" takes up to 30 values
      const part = need.slice(i, i + 30);
      // Each part fails on its own (e.g. rules not published yet), so prices still load without the others.
      const soft = q => fs.getDocs(q).catch(e => { console.warn('Firestore read failed', e.code); return null; });
      const [rep, st, dec] = await Promise.all([
        S.fuel === 'off' ? null : fs.getDocs(fs.query(fs.collection(db, 'reports'), fs.where('s', 'in', part))),
        soft(fs.query(fs.collection(db, 'status'), fs.where('s', 'in', part))),
        soft(fs.query(fs.collection(db, 'decisions'), fs.where(fs.documentId(), 'in', part)))
      ]);
      rep?.forEach(d => { const r = d.data(); if(r.at) byId.get(r.s)?.push({...r, at:r.at.toMillis()}); });
      st?.forEach(d => {
        const r = d.data(), v = sts.get(r.s); if(!v || r.v !== 'closed' || !r.at || now - r.at.toMillis() > ST_AGE) return;
        v.closed++;
        if(AU.user && r.uid === AU.user.uid) v.mine = 'closed';
      });
      dec?.forEach(d => decs.set(d.id, decRow(d.data())));
    }
    if(S.fuel !== 'off') byId.forEach((rs, id) => PR.map.set(id, summarize(rs)));
    sts.forEach((v, id) => PR.st.set(id, v));
    need.forEach(id => decs.has(id) ? PR.dec.set(id, decs.get(id)) : PR.dec.delete(id));
    refreshMap();
    return true;
  }catch(e){ console.warn('Could not load prices', e); need.forEach(id => PR.got.delete(id)); return false; }
}
const decRow = r => ({closed:!!r.closed, name:r.name || '', b:r.b || '', at:r.at ? r.at.toMillis() : 0});
// All admin decisions are few, so they're loaded once when the app opens: renamed stations then show
// their new name and brand color on the map right away.
async function loadDecisions(){
  try{
    const snap = await AU.fs.getDocs(AU.fs.collection(AU.db, 'decisions'));
    snap.forEach(d => PR.dec.set(d.id, decRow(d.data())));
    refreshMap(); if(page === 'list') render();
  }catch(e){ console.warn('Could not load station decisions', e.code); }
}
async function sendStatus(id, v){
  if(!AU.user) return needSignIn(id, 'card');
  const {fs, db} = AU, uid = AU.user.uid, ref = fs.doc(db, 'status', `${id}_${uid}`);
  try{
    if(v) await fs.setDoc(ref, {s:id, v, at:fs.serverTimestamp(), uid}); else await fs.deleteDoc(ref);
  }catch(e){ console.warn(e); toast(e.code === 'permission-denied' ? 'You just did that. Wait a minute and try again.' : "Couldn't save. Check your connection and try again."); return; }
  toast(v === 'closed' ? "Thanks! We'll review it" : 'Your report was removed');
  PR.got.delete(id); await loadPrices([id]);
  if(selId === id) openStation(id);
  if(page === 'list') render();
}
// Admin only. `patch` changes the station's decision ({closed}, {name, b}); the rest is kept.
// An empty patch just marks the current reports as reviewed.
async function decide(id, patch, msg){
  if(!AU.admin) return;
  const {fs, db} = AU, cur = PR.dec.get(id) || {closed:false, name:'', b:''};
  const next = {closed:cur.closed, ...(cur.name ? {name:cur.name, b:cur.b} : {}), ...patch};
  if(!next.name){ delete next.name; delete next.b; }
  try{ await fs.setDoc(fs.doc(db, 'decisions', id), {...next, at:fs.serverTimestamp(), by:AU.user.uid}); }
  catch(e){ console.warn(e); toast("Couldn't save. Check the admins record and rules in Firebase."); return; }

// Admin review list: stations with closed reports or name/brand suggestions newer than their last decision.
const REV = {list:null, loading:false};
async function loadReview(){
  if(!AU.admin || REV.loading) return;
  REV.loading = true;
  try{
    const {fs, db} = AU, now = Date.now();
    const soft = q => fs.getDocs(q).catch(e => { console.warn('Review read failed', e.code); return null; });
    const [st, ch, dec] = await Promise.all([
      soft(fs.query(fs.collection(db, 'status'), fs.where('v', '==', 'closed'))),
      soft(fs.collection(db, 'changes')),
      soft(fs.collection(db, 'decisions'))
    ]);
    const decAt = new Map((dec ? dec.docs : []).map(d => [d.id, d.data().at ? d.data().at.toMillis() : 0]));
    const by = new Map(), row = id => by.get(id) || (by.set(id, {id, n:0, last:0, sug:[]}), by.get(id));
    const fresh = r => { const at = r.at ? r.at.toMillis() : 0; return now - at <= ST_AGE && at > (decAt.get(r.s) || 0) ? at : 0; };
    st?.forEach(d => { const r = d.data(), at = fresh(r); if(!at) return; const x = row(r.s); x.n++; x.last = Math.max(x.last, at); });
    ch?.forEach(d => {
      const r = d.data(), at = fresh(r); if(!at) return;
      const x = row(r.s), same = x.sug.find(g => g.name.toLowerCase() === r.name.toLowerCase() && g.b === r.b);
      if(same) same.n++; else x.sug.push({name:r.name, b:r.b, n:1});
      x.last = Math.max(x.last, at);
    });
    const list = [...by.values()].sort((a, b) => (b.n + b.sug.length) - (a.n + a.sug.length) || b.last - a.last);
    const missing = list.filter(x => !find(x.id)).map(x => x.id);
    if(missing.length){
      const j = await fetch(`/api/stations?ids=${missing.slice(0, 100).join(',')}`).then(r => r.json()).catch(() => ({stations:[]}));
      (j.stations || []).forEach(s => { if(!OSM.has(s.id)) OSM.set(s.id, s); });
    }
    REV.list = list;
  }catch(e){ console.warn('Could not load reports to review', e); REV.list = []; }
  finally{ REV.loading = false; }
  if(page === 'settings') render();
}

  const btn = (attr, label, cls = '') => `<button class="pill sm${cls}" style="background:var(--card);border:1px solid var(--line)" ${attr}>${label}</button>`;

// Road distances from Mapbox, per station: {o: where you were, m: meters (null = no route), t: seconds}.
// A result is reused until you're 300 m from where it was measured, and kept on the phone between visits.
const ROAD_KEY = 'karga-road';
const road = new Map((() => { try{ return JSON.parse(localStorage.getItem(ROAD_KEY) || '[]'); }catch(e){ return []; } })());
function saveRoads(){ try{ localStorage.setItem(ROAD_KEY, JSON.stringify([...road].slice(-600))); }catch(e){} }
const roadOf = s => { const r = pos && road.get(s.id); return r && km(r.o, pos) < 0.3 ? r : null; };
const roadTxt = r => r.m == null ? 'No road route' : fmtKm(r.m/1000);
let matrixBusy = false;
async function loadRoads(list){
  const need = list.filter(s => !roadOf(s)).slice(0, 24);
  if(!need.length || matrixBusy || !HAS_TOKEN || !pos) return;
  matrixBusy = true;
  const o = {...pos}, pts = [o, ...need].map(p => `${p.lon},${p.lat}`).join(';');
  try{
    const r = await fetch(`https://api.mapbox.com/directions-matrix/v1/mapbox/driving/${pts}?sources=0&annotations=distance,duration&access_token=${MAPBOX_TOKEN}`);
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    need.forEach((s, i) => { road.delete(s.id); road.set(s.id, {o, m:j.distances[0][i+1], t:j.durations[0][i+1]}); });
    saveRoads();
    if(page === 'list') render();
  }catch(e){}
  finally{ matrixBusy = false; }
}
function dirUrl(s){
  if(S.dir === 'waze') return `https://waze.com/ul?ll=${s.lat},${s.lon}&navigate=yes`;
  if(S.dir === 'apple') return `https://maps.apple.com/?daddr=${s.lat},${s.lon}`;
  return `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}`;
}

async function roadFor(s){
  const o = {...pos};
  try{
    const r = await fetch(`https://api.mapbox.com/directions/v5/mapbox/driving/${o.lon},${o.lat};${s.lon},${s.lat}?overview=false&access_token=${MAPBOX_TOKEN}`);
    if(!r.ok) throw new Error(r.status);
    const j = await r.json(), rt = j.routes && j.routes[0];
    road.delete(s.id); road.set(s.id, {o, m:rt ? rt.distance : null, t:rt ? rt.duration : null}); saveRoads();
  }catch(e){
    if(selId === s.id && $('road')){ $('road-km').textContent = fmtKm(km(o, s)); $('road').textContent = "Couldn't check the road. This is the straight-line distance."; }
    return;
  }
  const rd = road.get(s.id);
  if(selId === s.id && $('road')){ $('road-km').textContent = roadTxt(rd); $('road').textContent = rd.m != null ? `About ${fmtMin(rd.t)} drive` : ''; }
}

    let id;
    if(m){ Object.assign(m, {brand, name, note}); if(o.lat != null){ m.lat = +o.lat.toFixed(6); m.lon = +o.lon.toFixed(6); } id = m.id; }
    else { id = 'm' + Date.now().toString(36); S.mine.push({id, lat:+o.lat.toFixed(6), lon:+o.lon.toFixed(6), brand, name, note, added:new Date().toISOString()}); }
    if(F.size && !F.has(brand)){ F.add(brand); S.f = [...F]; renderTop(); }
    persist(); refreshMap(); closeSheet(); toast('Station saved');
  };
}

/* ===== Search (cities and towns only) ===== */
// Suggestions come from /api/towns (every city and town in the Philippines, with its province).
// Picking one turns on a town filter: the map and the Nearby list show only that town's stations
// (each station knows its town, `t`), until the filter chip's ✕ is tapped.
let searchT, searchN = 0, TOWN = null;
function openSearch(){
  openSheet(`${sheetHead('Find a city or town')}
    <div class="search">${I('search', 18)}<input id="sq" type="search" enterkeyhint="search" placeholder="City or town, e.g. Sison" autocomplete="off" maxlength="60"></div>
    <div id="sres"><p class="sub" style="margin:0;text-align:center;padding:12px 0">Pick a city or town to see all its gas stations, for example before a trip.</p></div>`);
  const q = $('sq'); q.focus();
  q.oninput = () => { clearTimeout(searchT); searchT = setTimeout(() => runSearch(q.value.trim()), 300); };
}
async function runSearch(q){
  const out = $('sres'); if(!out) return;
  if(q.length < 2){ out.innerHTML = ''; return; }
  const n = ++searchN;
  const near = pos ? `&lat=${pos.lat.toFixed(3)}&lon=${pos.lon.toFixed(3)}` : '';
  const j = await fetch(`/api/towns?q=${encodeURIComponent(q)}${near}`).then(r => r.ok ? r.json() : {towns:[]}).catch(() => null);
  if(n !== searchN || !$('sres')) return; // a newer search started
  if(!j){ out.innerHTML = '<p class="sub" style="margin:0;text-align:center;padding:12px 0">Search needs internet. Try again.</p>'; return; }
  const rows = (j.towns || []).map(t => `<button class="li" style="width:100%;text-align:left" data-town="${esc(t.id)}" data-tname="${esc(t.n)}" data-tprov="${esc(t.p)}" data-tll="${t.lon},${t.lat}">
      <span style="display:flex;gap:12px;align-items:center;min-width:0"><span class="ico" style="background:var(--card)">${I('place', 18)}</span>
        <span style="min-width:0"><span class="trunc" style="font-weight:600">${esc(t.n)}</span><span class="sub trunc">${esc([t.k === 'city' ? 'City' : 'Town', t.p].filter(Boolean).join(' · '))}</span></span></span>
      <span class="sub" style="flex-shrink:0">${t.c} station${t.c === 1 ? '' : 's'}</span></button>`).join('');
  out.innerHTML = rows ? `<div class="card" style="padding:12px"><div class="inner">${rows}</div></div>` : '<p class="sub" style="margin:0;text-align:center;padding:12px 0">No city or town by that name.</p>';
}
async function pickTown(ds){
  const [lon, lat] = ds.tll.split(',').map(Number);
  TOWN = {id:ds.town, n:ds.tname, p:ds.tprov, lat, lon};
  closeSheet(); go('map'); userMoved = true;
  setStatus('loading'); renderTop();
  try{
    const r = await fetch(`/api/stations?town=${encodeURIComponent(TOWN.id)}`);
    if(!r.ok) throw new Error(r.status);
    const list = (await r.json()).stations || [];
    replaceStations(list, s => s.t === TOWN.id);
    saveOsm(); setStatus(''); refreshMap(); renderTop();
    const pts = list.length ? list : [TOWN];
    const lons = pts.map(p => p.lon), lats = pts.map(p => p.lat);
    if(map) map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]], {padding:{top:150, bottom:120, left:40, right:40}, maxZoom:14, duration:900});
    toast(list.length ? `${list.length} station${list.length === 1 ? '' : 's'} in ${TOWN.n}` : `No stations listed in ${TOWN.n} yet`);
  }catch(e){ setStatus('error'); }
}
function clearTown(){ TOWN = null; refreshMap(); renderTop(); if(page === 'list') render(); }
const townChip = () => TOWN ? `<button class="chip c-blue" data-act="town-clear" aria-label="Show all stations again">${I('place', 14)}${esc(TOWN.n)}${TOWN.p ? ', ' + esc(TOWN.p) : ''} ${I('x', 14)}</button>` : '';

/* ===== Pages ===== */
let page = 'map';
function go(p){ if(placing && p !== 'map') endPlace(); page = p; closeSheet(); render(); scrollTo(0, 0); }
function chipsHTML(){
  return `<button class="sel${S.open ? ' on' : ''}" data-act="open-toggle" aria-pressed="${S.open}">${I('clock', 15)}Open now</button>` +
    `<button class="sel${F.size ? '' : ' on'}" data-f="all" aria-pressed="${!F.size}">All</button>` +
    BRANDS.map(b => `<button class="sel${F.has(b.k) ? ' on' : ''}" data-f="${b.k}" aria-pressed="${F.has(b.k)}">${b.n}</button>`).join('');
}
function renderTop(){
  const t = $('mtop'); if(!t) return;
  t.innerHTML = `<div class="row"><button class="sbar" data-act="search">${I('search', 18)}Search a city or town</button>
    <div class="mbtns"><button class="rb${loading ? ' spin' : ''}" data-act="refresh" aria-label="Load stations near me">${I('refresh')}</button>
    <button class="rb" data-act="map-style" aria-label="Map style and 3D">${I('layers')}</button>
    <button class="rb" data-act="locate" aria-label="Show my location">${I('locate')}</button></div></div>
    <div class="mchips" role="group" aria-label="Filters">${chipsHTML()}</div>
    ${TOWN ? `<div>${townChip()}</div>` : ''}
    <div id="mstatus">${statusHTML()}</div>`;
}
function render(){
  const root = $('page'), welcome = !started();
  $('navwrap').style.display = welcome ? 'none' : '';
  document.body.classList.toggle('on-map', !welcome && page === 'map');
  if(welcome){ root.innerHTML = welcomeHTML(); return; }
  document.querySelectorAll('.nav [data-page]').forEach(b => { const on = b.dataset.page === page; b.classList.toggle('on', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
  if(page === 'map'){
    root.innerHTML = '';
    renderTop();
    if(!mapStarted){ mapStarted = true; initMap(); } else if(map) map.resize();
    return;
  }
  root.innerHTML = `<main class="app">${page === 'list' ? listHTML() : settingsHTML()}</main>`;
}
function welcomeHTML(){
  return `<main class="welcome">
    <div class="logo">${logo(40)}</div>
    <div>
      <h1 class="h1" style="font-size:32px;font-weight:700;margin-bottom:8px">Karga</h1>
      <p class="sub" style="font-size:16px;margin:0;max-width:30ch">Find gas stations near you, compare fuel prices, and see how far each one is by road.</p>
    </div>
    <button class="cta" data-act="start">Get started</button>
    <p class="tiny" style="text-align:center;margin:0">No account needed.${FIREBASE_CONFIG ? ' Sign in with Google anytime in Settings to share fuel prices.' : ''}</p>
  </main>`;
}
function getStarted(){ S.started = true; persist(); page = 'map'; render(); startLocate(); }
function emptyHTML(icon, title, text, btn, act){
  return `<div class="card empty"><div class="ico">${I(icon)}</div><div class="t15">${title}</div><div class="sub">${text}</div>
    <button class="cta" style="height:44px;width:auto;padding:0 20px;font-size:14px" data-act="${act}">${btn}</button></div>`;
}
function listHTML(){
  const head = `<header class="row">
      <div style="min-width:0"><h1 class="h1 trunc">${TOWN ? esc(TOWN.n) : 'Nearby'}</h1><div class="sub trunc" style="margin-top:2px">${TOWN ? esc([TOWN.p, pos ? 'distances from you' : ''].filter(Boolean).join(' · ')) : pos ? 'Closest stations to you' : geo === 'asking' ? 'Finding your location…' : 'Location is off'}</div></div>
      <div class="mbtns"><button class="rb" data-act="search" aria-label="Search">${I('search')}</button>
      <button class="rb" data-act="locate" aria-label="Show my location">${I('locate')}</button></div>
    </header>
    <div class="mchips" style="flex:none" role="group" aria-label="Filters">${chipsHTML()}</div>
    ${TOWN ? `<div>${townChip()}</div>` : ''}
    ${priceShown() && (pos || TOWN) ? `<div class="tabs" role="radiogroup" aria-label="Sort stations">
      <button role="radio" aria-checked="${S.sort !== 'cheap'}" class="${S.sort !== 'cheap' ? 'on' : ''}" data-sort="near">Nearest</button>
      <button role="radio" aria-checked="${S.sort === 'cheap'}" class="${S.sort === 'cheap' ? 'on' : ''}" data-sort="cheap">Cheapest ${fuelName(S.fuel).toLowerCase()}</button></div>` : ''}`;
  const line = s => [s.name !== s.bn ? s.bn : '', s.addr, s.mine ? 'Added by you' : ''].filter(Boolean).join(', ');
  const priceLine = s => { if(!priceShown() || !sharedId(s.id)) return ''; const p = priceOf(s); return `<span class="sub" style="font-variant-numeric:tabular-nums">${p != null ? `${fuelName(S.fuel)} ${peso(p)}` : PR.map.has(s.id) ? 'No price yet' : ''}</span>`; };
  const rowHTML = (x, dist) => { const {s} = x, hr = hoursOf(s); return `<button class="li" style="width:100%;text-align:left" data-show="${esc(s.id)}">
        <span style="display:flex;gap:12px;align-items:center;min-width:0">${bico(s)}
          <span style="min-width:0"><span class="trunc" style="font-weight:600">${esc(s.name)}</span>${line(s) ? `<span class="sub trunc">${esc(line(s))}</span>` : ''}${isClosed(s) ? `<span class="sub trunc" style="color:var(--red)">Closed</span>` : hr.open != null ? `<span class="sub trunc" style="color:var(${hr.open ? '--green' : '--red'})">${esc(hr.text)}</span>` : ''}</span>
        </span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0"><span style="font-weight:600;font-variant-numeric:tabular-nums">${dist(x)}</span>${priceLine(s)}</span></button>`; };
  const favs = S.fav.map(f => find(f.id) || f);
  const pinnedHTML = dist => favs.length && !TOWN ? `<div class="card" style="padding:12px">
      <div class="sub" style="display:flex;gap:6px;align-items:center;padding:4px 4px 10px;font-size:14px"><span style="color:#f5b301;display:flex">${starIco(16, true)}</span>Pinned</div>
      <div class="inner">${favs.map(s => ({s, d:pos ? km(pos, s) : null})).sort((a, b) => (a.d ?? 0) - (b.d ?? 0)).map(x => rowHTML(x, dist)).join('')}</div>
    </div>` : '';
  if(!pos && !TOWN) return head + pinnedHTML(() => '') + emptyHTML('pin', 'Location is off', 'Turn on location to sort stations by distance.', 'Use my location', 'locate');
  // Take the 24 closest in a straight line (within 40 km, or anywhere in the picked town),
  // then rank them by road distance once Mapbox answers.
  const near = allStations().filter(s => passes(s) && (!TOWN || s.t === TOWN.id)).map(s => ({s, d:pos ? km(pos, s) : 0}))
    .filter(x => TOWN || x.d <= 40).sort((a, b) => a.d - b.d).slice(0, 24);
  setTimeout(() => {
    if(pos) loadRoads([...(TOWN ? [] : favs.filter(s => km(pos, s) <= 40)), ...near.map(x => x.s)]);
    loadPrices([...favs, ...near.map(x => x.s)].map(s => s.id)).then(ch => { if(ch && page === 'list') render(); });
  });
  const rk = x => { const r = roadOf(x.s); return r ? (r.m == null ? Infinity : r.m/1000) : x.d * 1.4; };
  // Cheapest: stations with a price first (lowest first, closer wins a tie), then the rest by distance.
  const cheap = priceShown() && S.sort === 'cheap';
  const pk = x => { const p = priceOf(x.s); return p == null ? Infinity : p; };
  // Stations reported closed always go last.
  const arr = near.sort((a, b) => (isClosed(a.s) - isClosed(b.s)) || (cheap ? (pk(a) - pk(b)) || (rk(a) - rk(b)) : rk(a) - rk(b)));
  const dist = x => { if(!pos) return ''; const r = HAS_TOKEN && roadOf(x.s); return !HAS_TOKEN || (!r && x.d > 40) ? fmtKm(x.d) : r ? roadTxt(r) : '…'; };
  if(!arr.length && TOWN) return head + emptyHTML('fuel', `No stations listed in ${esc(TOWN.n)}`, F.size || S.open ? 'Try turning off the brand or “Open now” filters.' : 'OpenStreetMap has no gas stations here yet.', 'Show all stations', 'town-clear');
  if(!arr.length) return head + pinnedHTML(dist) + emptyHTML('fuel', S.open ? 'No stations known to be open' : 'No stations found nearby',
    S.open ? 'Many stations don\'t list their hours yet. Turn off “Open now” to see every station.' : 'Tap the refresh button on the map to load stations where you are.', S.open ? 'Show all stations' : 'Open map', S.open ? 'open-toggle' : 'open-map');
  const [n, ...rest] = arr;
  const fb = F.size === 1 ? ([...F][0] === 'other' ? 'other-brand station' : brandName([...F][0])) : 'station';
  const where = TOWN ? `in ${TOWN.n}` : 'nearby';
  const label = cheap && pk(n) !== Infinity ? `Cheapest ${fuelName(S.fuel).toLowerCase()} ${where}, ${peso(pk(n))}` : TOWN ? `${pos ? 'Closest' : 'A'} station in ${TOWN.n}` : `Nearest ${fb}`;
  return head + pinnedHTML(dist) + `
    <section class="blk">
      <div class="cap">${label}</div>
      ${pos ? `<div class="amt">${dist(n)}</div>` : ''}
      <div class="trunc" style="margin-top:6px;font-weight:600">${esc(n.s.name)}</div>
      ${line(n.s) ? `<div class="cap trunc" style="margin-top:2px">${esc(line(n.s))}</div>` : ''}
      <div class="g2" style="margin-top:18px">
        <button class="pill" data-show="${esc(n.s.id)}">${I('map', 18)}Show on map</button>
        <button class="pill" data-dir="${esc(n.s.id)}">${I('nav', 18)}Directions</button>
      </div>
    </section>
    ${rest.length ? `<div class="card" style="padding:12px">
      <div class="sub" style="padding:4px 4px 10px;font-size:14px">${TOWN ? `More in ${esc(TOWN.n)}` : 'More nearby'}</div>
      <div class="inner">${rest.map(x => rowHTML(x, dist)).join('')}</div>
    </div>` : ''}
    <p class="tiny" style="margin:0;text-align:center">${!pos ? 'Turn on location to see how far each one is.' : HAS_TOKEN ? 'Distance by road from where you are.' : 'Straight-line distance.'}</p>`;
}
function settingsHTML(){
  const head = (icon, t) => `<div class="sub" style="display:flex;gap:8px;align-items:center;padding:2px 4px 10px;font-size:14px">${I(icon, 18)}${t}</div>`;
  const opt = (attr, val, cur, icon, t) => `<button role="radio" aria-checked="${cur === val}" class="${cur === val ? 'on' : ''}" ${attr}="${val}">${icon ? I(icon, 18) : ''}${t}</button>`;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  return `<h1 class="h1">Settings</h1>
  ${accountHTML()}
  ${reviewHTML()}
  <div class="card" style="padding:12px">
    ${head('nav', 'Directions')}
    <div class="seg3" role="radiogroup" aria-label="Open directions in">
      ${opt('data-dir-set', 'google', S.dir, '', 'Google Maps')}${opt('data-dir-set', 'waze', S.dir, '', 'Waze')}${opt('data-dir-set', 'apple', S.dir, '', 'Apple Maps')}
    </div>
    <p class="tiny" style="margin:10px 4px 2px">The Directions button opens this app.</p>
  </div>
  ${PR.on === false ? '' : `<div class="card" style="padding:12px">
    ${head('tag', 'Fuel prices')}
    <div class="seg3" style="grid-template-columns:repeat(4,minmax(0,1fr))" role="radiogroup" aria-label="Fuel price to show">
      ${opt('data-fuel-set', 'off', S.fuel, '', 'Off')}${FUELS.map(f => opt('data-fuel-set', f.k, S.fuel, '', f.n)).join('')}
    </div>
    <p class="tiny" style="margin:10px 4px 2px">${S.fuel === 'off' ? 'Prices are hidden.' : `The Nearby list shows ${fuelName(S.fuel).toLowerCase()} prices and can sort by the cheapest.`} Prices are shared by Karga users, so they can be out of date. You can update a station's prices from its card.</p>
  </div>`}
  <div class="card" style="padding:12px">
    ${head('fuel', 'Stations')}
    <div class="inner">
      <div class="li"><span>Pinned stations</span><span style="font-weight:600">${S.fav.length}</span></div>
      <div class="li"><span>Stations you added</span><span style="font-weight:600">${S.mine.length}</span></div>
      <div class="li"><span>Stations saved on this device</span><span style="font-weight:600">${OSM.size}</span></div>
    </div>
    <p class="tiny" style="margin:10px 4px 2px">Station data comes from OpenStreetMap and is saved on this device, refreshing about once a week. Tap the refresh button on the map to load stations where you are now.</p>
  </div>
  <div class="card" style="padding:12px">
    ${head('sun', 'Appearance')}
    <div class="seg3" role="radiogroup" aria-label="Appearance">
      ${opt('data-theme-set', 'light', S.theme, 'sun', 'Day')}${opt('data-theme-set', 'dark', S.theme, 'moon', 'Night')}${opt('data-theme-set', 'auto', S.theme, 'phone', 'Auto')}
    </div>
    <p class="tiny" style="margin:10px 4px 2px">Auto follows your iPhone's light or dark setting.</p>
  </div>
  ${standalone ? '' : `<div class="card" style="display:flex;gap:14px;align-items:flex-start">
    <div class="logo" style="width:44px;height:44px;border-radius:12px;flex-shrink:0">${logo(26)}</div>
    <div><div class="t15">Use it like an app</div><div class="sub" style="margin-top:3px;font-size:13.5px">In Safari, tap Share, then Add to Home Screen. Karga opens full screen, like a regular app.</div></div>
  </div>`}
  <button class="sec danger" data-act="erase">${I('trash', 18)}Erase all data</button>`;
}
/* ===== Events ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-page],[data-act],[data-f],[data-show],[data-dir],[data-edit],[data-del],[data-fav],[data-theme-set],[data-dir-set],[data-fuel-set],[data-sort],[data-town],[data-price],[data-confirm],[data-status],[data-decide],[data-approve],[data-rename]');
  if(!t) return;
  const ds = t.dataset;
  if(ds.page) return go(ds.page);
  if(ds.confirm) return confirmPrice(ds.confirm);
  if(ds.status != null){
    const [id, v] = ds.status.split('|');
    if(!AU.user) return needSignIn(id, 'card');
    if(v === 'closed') return confirmSheet('Report this station closed?', "Only report it if the station is closed for good or no longer sells fuel. We'll review it before marking it closed.", 'Report closed', true, () => sendStatus(id, 'closed'));
    return sendStatus(id, v || null);
  }
  if(ds.decide){
    const [id, v] = ds.decide.split('|');
    if(v === 'closed') return confirmSheet('Mark this station closed?', "Everyone will see it as closed: faded on the map and at the end of lists. You can mark it open again later.", 'Mark closed', true, () => decide(id, {closed:true}, 'Marked closed'));
    if(v === 'open') return decide(id, {closed:false}, 'Marked open');
    return decide(id, {}, 'Reports dismissed');
  }
  if(ds.approve){
    const [id, b, ...rest] = ds.approve.split('|');
    return decide(id, {closed:false, name:rest.join('|'), b}, 'Renamed. Everyone sees the new name now');
  }
  if(ds.rename){ const id = ds.rename; closeSheet(); return openRenameForm(id); }
  if(ds.fav) return toggleFav(ds.fav);
  if(ds.town) return pickTown(ds);
  if(ds.price){ const id = ds.price; closeSheet(); return openPriceForm(id); }
  if(ds.sort){ S.sort = ds.sort; persist(); return render(); }
  if(ds.fuelSet){ S.fuel = ds.fuelSet; persist(); return render(); }
  if(ds.f){
    if(ds.f === 'all') F.clear(); else F.has(ds.f) ? F.delete(ds.f) : F.add(ds.f);
    S.f = [...F]; persist(); refreshMap();
    page === 'map' ? renderTop() : render();
    return;
  }
  if(ds.show){
    const s = find(ds.show); if(!s) return;
    go('map'); setTimeout(() => openStation(s.id), 60); return;
  }
  if(ds.dir){ const s = find(ds.dir); if(s) window.open(dirUrl(s), '_blank', 'noopener'); return; }
  if(ds.edit){ const id = ds.edit; closeSheet(); openForm({editId:id}); return; }
  if(ds.del){
    const id = ds.del;
    confirmSheet('Delete this station?', "It will be removed from your map. This can't be undone.", 'Delete station', true, () => {
      S.mine = S.mine.filter(x => x.id !== id); S.fav = S.fav.filter(x => x.id !== id); persist(); refreshMap(); toast('Station deleted');
    });
    return;
  }
  if(ds.themeSet){ S.theme = ds.themeSet; persist(); applyTheme(S.theme); restyleMap(); render(); return; }
  if(ds.dirSet){ S.dir = ds.dirSet; persist(); render(); return; }
  if(ds.act && ds.act.startsWith('maptype-')) return setMapType(ds.act.slice(8));
  switch(ds.act){
    case 'start': return getStarted();
    case 'add': return startPlace();
    case 'locate': closeSheet(); return locateMe();
    case 'open-map': return go('map');
    case 'retry': return loadArea(true);
    case 'place-ok': {
      const c = map.getCenter(), editId = placing && placing.editId;
      endPlace(); openForm({lat:c.lat, lon:c.lng, editId}); return;
    }
    case 'place-cancel': endPlace(); return;
    case 'signin': return signIn();
    case 'goto-signin': return gotoSignIn();
    case 'review-refresh': REV.list = null; return render();
    case 'signout': return signOut();
    case 'refresh': return refreshHere();
    case 'map-style': return openMapStyle();
    case 'map-3d': return toggle3d();
    case 'search': return openSearch();
    case 'town-clear': return clearTown();
    case 'open-toggle':
      S.open = !S.open; persist(); refreshMap();
      if(S.open) toast('Showing stations open right now. Many stations don\'t list their hours yet.');
      return page === 'map' ? renderTop() : render();
    case 'erase':
      return confirmSheet('Erase all data?', AU.user
        ? "This removes your settings, pinned stations and every station you added from this device and from your Google account, deletes the fuel prices you shared, and signs you out. This can't be undone."
        : "This removes your settings, pinned stations and every station you added from this device. This can't be undone.", 'Erase all data', true, async () => {
        try{ await eraseCloud(); }catch(err){ console.warn(err); toast("Couldn't erase your account data. Check your connection and try again."); return; }
        try{ localStorage.removeItem(KEY); localStorage.removeItem(OSM_KEY); localStorage.removeItem(ROAD_KEY); }catch(err){}
        location.reload();
      });
  }
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('scrim')) closeSheet(); else if(placing) endPlace();
});

/* ===== Start ===== */
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(S.theme);
  render();
  if(started()) startLocate();
  initData();
  initFirebase();
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
});
</script>
