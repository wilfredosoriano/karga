# Refreshes api/_stations.js and api/_towns.js from OpenStreetMap on the 1st of every month and
# commits them; Vercel redeploys on the push. It can also be started by hand from the Actions tab.
# If a run fails (busy servers, or far fewer stations than before), nothing is committed and the
# app keeps using last month's list.
name: Update stations

on:
  schedule:
    - cron: '0 18 1 * *' # 2 AM Philippine time on the 1st
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-stations.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add api/_stations.js api/_towns.js
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update stations from OpenStreetMap"
          git push
